name: tiny-tonkean

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tonkean
      MYSQL_USER: tonkean
      MYSQL_PASSWORD: tonkean
    # Data lives in memory: every `docker compose up` starts from the seed in db/init.
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    healthcheck:
      # 127.0.0.1 forces TCP, which only opens after the init scripts have finished.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-utonkean', '-ptonkean']
      interval: 3s
      timeout: 3s
      retries: 40

  tickets:
    build:
      context: .
      dockerfile: apps/tickets/Dockerfile
    environment:
      TICKETS_API_TOKEN: tickets-dev-token
    ports:
      - '4200:4200'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4200/api/tickets']
      interval: 3s
      timeout: 3s
      retries: 20

  chatter:
    build:
      context: .
      dockerfile: apps/chatter/Dockerfile
    environment:
      CHATTER_API_TOKEN: chatter-dev-token
    ports:
      - '4100:4100'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/api/channels']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: tonkean
      DB_PASSWORD: tonkean
      DB_NAME: tonkean
      JWT_SECRET: local-dev-jwt-secret
      BACKEND_PUBLIC_URL: http://localhost:4000
    ports:
      - '4000:4000'
    depends_on:
      mysql:
        condition: service_healthy
      tickets:
        condition: service_healthy
      chatter:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - '5173:5173'
    depends_on:
      - backend
